# Chạy toàn bộ BrewLite (web + api + db) bằng một lệnh:  docker compose up -d --build
# Biến lấy từ file .env ở thư mục gốc (xem .env.example).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - brewlite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brewlite}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-brewlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
      JWT_SECRET: ${JWT_SECRET:?Đặt JWT_SECRET trong file .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      # Admin đầu tiên (tuỳ chọn): có cả hai biến thì tự tạo/nâng tài khoản admin khi API khởi động
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      API_PORT: 3001
    ports:
      - "${API_PORT:-3001}:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  brewlite_pgdata:
