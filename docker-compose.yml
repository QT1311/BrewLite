# Bước 1: chỉ có cơ sở dữ liệu. Các dịch vụ web/api sẽ được thêm ở bước đóng gói Docker (Task 5.2).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - brewlite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brewlite}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  brewlite_pgdata:
