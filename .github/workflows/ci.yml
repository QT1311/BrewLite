# CI cho BrewLite (Task 4.4 + 5.2): Lint → Test → Build → E2E (Docker Compose + Playwright).
# Chạy khi push lên main và khi mở/cập nhật Pull Request vào main.
# Bật "Require status checks to pass" cho nhánh main để PR lỗi không merge được (NFR-08).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test (unit + integration)
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_DB: brewlite_test
      JWT_SECRET: ci-only-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Unit test (API + web)
        run: npm test
      - name: Integration test (đặt đơn / thanh toán trên PostgreSQL)
        run: npm run test:e2e

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E (Docker Compose + Playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JWT_SECRET: ci-only-jwt-secret
      STAFF_API_KEY: ci-only-staff-key
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Dựng web + api + db bằng Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Cài trình duyệt Playwright
        run: npx playwright install --with-deps chromium
      - name: Chạy kiểm thử E2E giao diện
        run: npm run test:ui
      - name: Lưu báo cáo khi E2E thất bại
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Log container khi thất bại
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Dọn dẹp
        if: always()
        run: docker compose down -v
